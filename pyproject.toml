[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanka-postal-codes"
version = "1.0.0"
description = "Comprehensive, clean, and zero-dependency dataset and search utility for Sri Lanka postal codes and post offices."
readme = "README.md"
authors = [{ name = "Antigravity Lab" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = ["sri-lanka", "postal-codes", "zip-codes", "post-offices", "colombo", "kandy", "galle"]
requires-python = ">=3.8"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/qaadi/lanka-postal-codes"
"Bug Tracker" = "https://github.com/qaadi/lanka-postal-codes/issues"

[tool.hatch.build.targets.wheel]
packages = ["lanka_postal_codes"]

[tool.hatch.build.targets.wheel.force-include]
"data/postal_codes.json" = "lanka_postal_codes/data/postal_codes.json"
