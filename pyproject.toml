[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lankapost"
version = "1.0.1"
description = "Comprehensive, clean, and zero-dependency dataset and search utility for Sri Lanka postal codes and post offices."
readme = "README.md"
authors = [{ name = "Antigravity Lab" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
keywords = [
    "lankapost",
    "sri-lanka",
    "sri-lanka-postal-codes",
    "sri-lanka-zip-codes",
    "sri-lanka-pincode",
    "postal-codes",
    "zip-codes",
    "postcodes",
    "pincode",
    "post-offices",
    "colombo-postal-codes",
    "colombo",
    "kandy",
    "galle",
    "jaffna",
    "negombo",
    "districts",
    "provinces",
    "address-validation",
    "ecommerce-sri-lanka",
    "slpost",
]
requires-python = ">=3.8"
dependencies = []

[project.urls]
"Homepage" = "https://github.com/AbQaadir/lankapost"
"Bug Tracker" = "https://github.com/AbQaadir/lankapost/issues"

[tool.hatch.build.targets.wheel]
packages = ["lankapost"]

[tool.hatch.build.targets.wheel.force-include]
"data/postal_codes.json" = "lankapost/data/postal_codes.json"
